name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages whenever this branch updates.
on:
  push:
    branches:
      - claude/meeting-cost-counter-RYaBn
  workflow_dispatch: # also allows publishing manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
